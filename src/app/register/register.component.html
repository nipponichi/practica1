<table>
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Height (m)</th>
        <th>Weight (kg)</th>
        <th>Gender</th>
        <th>IMC</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let imc of imcList; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ imc.name }}</td>
        <td>{{ imc.height }}</td>
        <td>{{ imc.weight }}</td>
        <td>{{ imc.isMale ? 'M' : 'F' }}</td>
        <td>{{ imc.result }}</td>
      </tr>
    </tbody>
  </table>
