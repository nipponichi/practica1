<div class="calculator-container">
    <mat-card-content>
        <mat-form-field>
            <mat-label>Name</mat-label>
            <input matInput [value]="imc.name" (input)="updateName($event)" placeholder="Paco Ramírez">
        </mat-form-field>
    </mat-card-content>

    <mat-card-content>
        <app-radio-button option1Label="Masculino" option2Label="Femenino" 
            [option1Value]="true" [option2Value]="false" (value)="setGender($event)">
        </app-radio-button>
    </mat-card-content>

    <mat-card-content>
        <app-slider #heightSlider (receivedData)="sendData1($event)" value="Height" [min]="0" [max]="225" [step]="1" unit="cm"></app-slider>
    </mat-card-content>

    <mat-card-content>
        <app-slider #weightSlider (receivedData)="sendData2($event)" value="Weight" [min]="0" [max]="150" [step]=".5" unit="kg"></app-slider>
    </mat-card-content>
    
    <mat-card-content class="result">
        <p>IMC: {{ imc.result }}</p>
    </mat-card-content>
  
    <div class="button">
        <mat-card-content>
            <button mat-raised-button color="warn" (click)="resetForm()">Reset</button>
        </mat-card-content>
        <mat-card-content>
            <button mat-raised-button color="primary" (click)="saveRegister()">Guardar</button>
        </mat-card-content>
    </div>
</div>
