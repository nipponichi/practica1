<form [formGroup]="formAngular2" class="form-container">
  <div class="slider-container">
    <button mat-icon-button class="red-button" (click)="reduceValue()">
      <mat-icon>remove</mat-icon>
    </button>
    
    <mat-slider [min]="min" [max]="max" [step]="step"
        [displayWith]="formatLabel" (input)="onSliderChange($event)" class="custom-slider">
        <input matSliderThumb [value]="slider.value">
    </mat-slider>

    <button mat-icon-button class="blue-button" (click)="incrementValue()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <div class="input-container">  
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ value }}</mat-label>
      <input matInput type="number" formControlName="inputValue" [value]="slider.value"
             [min]="min" [max]="max" inputmode="numeric">
      <mat-hint>{{ unit }}</mat-hint>
    </mat-form-field>
  </div>   
</form>
